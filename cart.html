<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to cart</title>
    <link rel="stylesheet" href="./css/rushita.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div id="header-placeholder"></div>
    <section class="relative bg-cover bg-center py-16 md:py-24"
        style="background-image: url('./images/checkout.webp');">


        <div class="relative z-10 container mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">Cart</h1>

            <div class="flex items-center justify-center text-gray-700 text-sm space-x-2">
                <a href="#" class="flex items-center hover:text-teal-600">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-4 h-4 mr-1">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75V21h15V9.75" />
                    </svg>
                    Home
                </a>
                <span>›</span>
                <span class="text-gray-900 font-semibold">Cart</span>
            </div>
        </div>
    </section>
      <section class="a_header_container mx-auto  py-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 py-10">
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-sm overflow-x-auto">
                    <div class="min-w-[600px]">
                        <div class="grid grid-cols-12 gap-4 px-6 py-4 bg-gray-50 border-b text-sm font-semibold text-gray-700">
                            <div class="col-span-1"></div>
                            <div class="col-span-4">Products</div>
                            <div class="col-span-2 text-center">Price</div>
                            <div class="col-span-3 text-center">Quantity</div>
                            <div class="col-span-2 text-right">Subtotal</div>
                        </div>
                      <div id="cartItemsContainer">
                        <!-- Cart items will be inserted here -->
                    </div>
              


                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
               <div class="bg-white rounded-lg shadow-sm overflow-hidden" id="cartTotals">
  <h2 class="text-2xl font-bold text-gray-900 px-6 py-6 border-b">Cart totals</h2>

  <div class="flex justify-between items-center px-6 py-5 bg-gray-50 border-b">
    <span class="text-gray-900 font-semibold uppercase text-sm">SUBTOTAL</span>
    <span id="subtotal" class="text-gray-900 font-medium">$0.00</span>
  </div>

  <div class="px-6 py-5 bg-white border-b">
    <div class="flex justify-between items-start mb-2">
      <span class="text-gray-900 font-semibold uppercase text-sm">SHIPPING</span>
      <div class="text-right">
        <p class="text-gray-900 font-medium mb-1">Flat rate:
          <span id="shippingCost" class="font-bold">$0.00</span>
        </p>
        <!-- <p class="text-gray-600 text-sm mb-2">Shipping to <span id="shippingAddress" class="font-semibold">CA</span></p>
        <a href="#" id="changeAddress" class="text-gray-900 text-sm underline inline-flex items-center hover:text-green-700">
          Change address
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke-width="2" stroke="currentColor" class="w-4 h-4 ml-1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a> -->
      </div>
    </div>
  </div>
 
  <div class="flex justify-between items-center px-6 py-5 bg-gray-50">
    <span class="text-gray-900 font-bold uppercase text-base">TOTAL</span>
    <span id="total" class="text-gray-900 font-bold text-lg">$0.00</span>
  </div>

  <div class="px-6 py-6">
    <button id="checkoutBtn"
      class="w-full py-2 text-white font-semibold rounded hover:opacity-90 transition"
      style="background-color: #02b290;">
     <a href="./checkout.html"> Proceed to checkout</a>
    </button>
  </div>
</div>

<!-- Optional Address Modal -->
<div id="addressModal"
  class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
  <div class="bg-white rounded-lg p-6 w-80">
    <h3 class="text-lg font-bold mb-4">Change Address</h3>
    <select id="addressSelect" class="border p-2 rounded w-full mb-4">
      <option value="CA" data-shipping="22">California ($22)</option>
      <option value="NY" data-shipping="18">New York ($18)</option>
      <option value="TX" data-shipping="15">Texas ($15)</option>
      <option value="FREE" data-shipping="0">Free Pickup</option>
    </select>
    <button id="saveAddress" class="bg-[#02b290] text-white px-4 py-2 rounded w-full">Save</button>
  </div>
</div>
            </div>
        </div>
    </section>  
    <div id="footer_add"></div>
    <script src="./js/rushita.js"></script>
    <script src="./js/wishlist.js"></script>
    <script src="./js/addtocart.js"></script>

<script>
  document.getElementById("checkoutBtn")?.addEventListener("click", () => {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  // ✅ Save cart to localStorage for checkout page
  localStorage.setItem("checkoutCart", JSON.stringify(cart));

  // ✅ Redirect to checkout page
  window.location.href = "./checkout.html";
});

</script>
</body>

</html>
