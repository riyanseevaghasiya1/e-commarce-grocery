<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#14B8A6',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen">
    <div id="header-placeholder"></div>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto px-4 py-8 md:py-12">
        <!-- Header Section -->
        <div class="text-center mb-8 md:mb-12">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Track Your Order</h1>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <h2 class="text-sm text-gray-500 mb-1">Order ID</h2>
                    <p id="trackingOrderId" class="text-lg md:text-xl font-semibold text-gray-800">—</p>
                </div>
                <div>
                    <h2 class="text-sm text-gray-500 mb-1">Order Date</h2>
                    <p id="trackingOrderDate" class="text-lg font-medium text-gray-800">—</p>
                </div>
                <div>
                    <h2 class="text-sm text-gray-500 mb-1">Estimated Delivery</h2>
                    <p id="trackingEstimatedDelivery" class="text-lg font-medium text-primary">—</p>
                </div>
            </div>
        </div>

        <!-- Tracking Stepper -->
        <div class="bg-white rounded-lg shadow-md p-6 md:p-8 mb-8">
            <div id="desktopTimeline" class="hidden md:flex items-center justify-between"></div>
            <div id="mobileTimeline" class="md:hidden"></div>
        </div>

        <!-- Delivery Address -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Delivery Address</h3>

            <div id="deliveryAddressBox" class="text-sm text-gray-700 space-y-1">
                <p class="text-gray-500">Address not available</p>
            </div>
        </div>
        <!-- Order Items -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-6">
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Order Items</h3>
                    <div id="orderItemsList" class="space-y-4"></div>
                </div>
                <div class="w-full lg:w-64 bg-gray-50 border border-gray-200 rounded-lg p-4">
                    <h4 class="text-base font-semibold text-gray-800 mb-3">Summary</h4>
                    <div id="exchangeBox"></div>
                    <div class="space-y-2 text-sm text-gray-600">
                        <div class="flex justify-between">
                            <span>Subtotal</span>
                            <span id="summarySubtotal" class="current-price">$0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Discount</span>
                            <span id="summaryDiscount" class="current-price">-$0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Shipping</span>
                            <span id="summaryShipping" class="current-price">$0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Payment Method</span>
                            <span id="summaryPayment" style="text-align: end;">—</span>
                        </div>
                    </div>
                    <div
                        class="flex justify-between text-lg font-semibold text-gray-800 mt-4 pt-4 border-t border-gray-200">
                        <span>Total</span>
                        <span id="summaryTotal" class="text-primary current-price">$0.00</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="footer_add"></div>
    <script src="./js/rushita.js"></script>
    <script src="./js/wishlist.js"></script>
    <script src="./js/addtocart.js"></script>
    <script src="./js/OrderTracking.js"></script>
</body>

</html>
