<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Account - Grocery Store</title>
	<link rel="stylesheet" href="./css/h_style.css">
	<link rel="stylesheet" href="./index.css">
	<script src="https://cdn.tailwindcss.com"></script>
	<link
		href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@400;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<style>
		.active-tab {
			background-color: #e5e5e5;
			border-left: 4px solid #02B290;
			color: #02B290;
		}

		body::-webkit-scrollbar {
			display: none;
		}
		#accountForm.editing input[type="text"],
		#accountForm.editing input[type="email"] {
			border-color: #02B290 !important;
			box-shadow: 0 0 0 2px rgba(2, 178, 144, 0.15);
		}
	</style>
</head>

<body class="inter-font">
	<div id="header-placeholder"></div>
	<div class="a_header_container">
		<main class="flex flex-col md:flex-row gap-6 flex-grow py-8 md:py-10 xl:py-12 2xl:py-14 3xl:py-18">
			<aside class="w md:w-2/6 lg:w-1/4 bg-white shadow rounded-lg p-5">
				<h2 class="text-lg font-semibold mb-4">My Account</h2>
				<ul class="space-y-3">
					<li><button class="tab-btn w-full text-left py-2 px-3 rounded hover:text-[#02B290] active-tab"
							data-tab="details">Account Details</button></li>
					<li><button class="tab-btn w-full text-left py-2 px-3 rounded hover:text-[#02B290]"
							data-tab="orders">Order List</button></li>
					<li><button class="tab-btn w-full text-left py-2 px-3 rounded hover:text-[#02B290]"
							data-tab="shipping">Shipping Address</button></li>
					<li><button class="tab-btn w-full text-left py-2 px-3 rounded hover:text-[#02B290]"
							data-tab="logout">Logout</button></li>
				</ul>
			</aside>

			<!-- Account Page Skeleton Loader -->
			<div id="accountSkeleton" class="w-full bg-white shadow rounded-lg p-6 animate-pulse">

				<!-- Title -->
				<div class="h-6 w-40 bg-gray-300 rounded mb-6"></div>

				<!-- Profile Section -->
				<div class="flex flex-col sm:flex-row items-center gap-6 mb-6">
					<div class="w-28 h-28 rounded-full bg-gray-300"></div>

					<div class="flex-1 space-y-3 w-full">
						<div class="h-4 bg-gray-300 rounded w-1/3"></div>
						<div class="h-4 bg-gray-300 rounded w-1/2"></div>
					</div>
				</div>

				<!-- Form Fields -->
				<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
					<div class="h-10 bg-gray-300 rounded"></div>
					<div class="h-10 bg-gray-300 rounded"></div>
					<div class="h-10 bg-gray-300 rounded"></div>
					<div class="h-10 bg-gray-300 rounded"></div>
					<div class="h-12 bg-gray-300 rounded md:col-span-2"></div>
				</div>
			</div>

			<section class="md:w-4/6 lg:w-3/4 bg-white shadow rounded-lg p-6" id="accountMain" style="display: none;">
				<!-- Account Details -->
				<div id="details" class="tab-content">
					<h2 class="text-2xl font-semibold mb-4 text-[#02B290]">Account Details</h2>
					<div
						class="flex flex-col sm:flex-row items-center gap-6 bg-white shadow-md p-6 mb-6 rounded-xl border border-gray-100">
						<div class="relative">
							<img id="profileImage"
								src="https://i.pinimg.com/1200x/9e/83/75/9e837528f01cf3f42119c5aeeed1b336.jpg"
								class="w-28 h-28 rounded-full object-cover border-4 border-[#d3d3d3] shadow-md"
								alt="Profile Image">
							<label for="uploadImage"
								class="absolute bottom-0 right-0 bg-[#02B290] text-white py-[6px] px-[10px] rounded-full cursor-pointer shadow hover:bg-[#02997c] transition hidden">
								<i class="fa-solid fa-camera text-sm"></i>
							</label>
							<input type="file" id="uploadImage" accept="image/*" class="hidden">
						</div>
						<div class="text-center sm:text-left">
							<h3 class="text-lg font-semibold text-gray-800">Profile Picture</h3>
							<p class="text-sm text-gray-500 mb-2">Upload a clear image of yourself</p>
						</div>
					</div>

					<form id="accountForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
						<div>
							<label class="block font-medium mb-1">Full Name</label>
							<input type="text" id="fullName" placeholder="John Doe"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none placeholder:text-gray-500"
								disabled>
						</div>
						<div>
							<label class="block font-medium mb-1">Email Address</label>
							<input type="email" id="email" placeholder="john@example.com"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none placeholder:text-gray-500"
								disabled>
						</div>
						<div>
							<label class="block font-medium mb-1">Phone Number</label>
							<input type="text" id="phone" placeholder="+91 98765 43210"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none placeholder:text-gray-500"
								disabled>
						</div>
						<div class="md:col-span-2 flex gap-3 mt-3">
							<button id="editBtn" type="button"
								class="bg-[#02B290] text-white px-4 py-2 rounded hover:bg-[#4dc9b1]">Edit</button>
							<button id="saveBtn" type="button"
								class="bg-[#02B290] text-white px-4 py-2 rounded hover:bg-[#4dc9b1] hidden">Save
								Changes</button>
						</div>
					</form>
				</div>

				<div id="ordersSkeleton" class="hidden w-full bg-white shadow rounded-lg p-6 animate-pulse">
					<div class="h-6 w-32 bg-gray-300 rounded mb-6"></div>

					<div class="space-y-4">
						<div class="h-10 bg-gray-300 rounded"></div>
						<div class="h-10 bg-gray-300 rounded"></div>
						<div class="h-10 bg-gray-300 rounded"></div>
					</div>
				</div>

				<!-- Order List -->
				<div id="orders" class="tab-content hidden">
					<h2 class="text-2xl font-semibold mb-4 text-[#02B290] sm:flex items-center justify-between">
						<span>Your Orders</span>
						<button id="ordersBackBtn" class="flex items-center gap-2 mt-2 sm:mt-0 border px-2 sm:px-3 py-0 sm:py-2 rounded text-[14px] sm:text-[16px] text-gray-700 hover:bg-gray-100">
							<i class="fa-solid fa-arrow-left"></i>
							Back to Profile
						</button>
					</h2>
					<div class="overflow-x-auto"> 
						<table class="min-w-[560px] w-full border rounded">
							<thead class="bg-[#e5e5e5]">
								<tr>
									<th class="py-2 px-3 text-left">Order ID</th>
									<th class="py-2 px-3 text-left">Date</th>
									<th class="py-2 px-3 text-left">Total</th>
									<th class="py-2 px-3 text-left">Status</th>
									<th class="py-2 px-3 text-left">Action</th>
								</tr>
							</thead>
							<tbody id="ordersTableBody"></tbody>
						</table>
						<div id="ordersEmptyState" class="hidden py-10 text-center text-gray-500">
							No orders yet. Start shopping to see your orders here.
						</div>
					</div>
				</div>

				<div id="shippingSkeleton" class="hidden w-full bg-white shadow rounded-lg p-6 animate-pulse">
					<div class="h-6 w-48 bg-gray-300 rounded mb-6"></div>

					<div class="space-y-4">
						<div class="h-24 bg-gray-300 rounded"></div>
						<div class="h-24 bg-gray-300 rounded"></div>
					</div>
				</div>

				<!-- Shipping Address -->
				<div id="shipping" class="tab-content hidden">
					<h2
						class="text-2xl font-semibold mb-6 text-[#02B290] flex flex-wrap justify-between items-center gap-2">
						<span>Shipping Address</span>
						<button id="toggleEdit"
							class="bg-[#02B290] text-white text-base px-5 py-2 rounded-lg shadow hover:bg-[#4dc9b1] transition-all">Add
							address</button>
					</h2>

					<div id="addressList"></div>

					<form id="shippingForm"
						class="hidden bg-white border border-gray-200 rounded-2xl p-6 shadow-md grid grid-cols-1 md:grid-cols-2 gap-4">
						<div>
							<label class="block font-medium mb-1 text-gray-700">First Name</label>
							<input type="text" id="shipfname" placeholder="First Name"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">Last Name</label>
							<input type="text" id="shiplname" placeholder="Last Name"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">Street Address</label>
							<input type="text" id="shipStreet" placeholder="456 Garden Ave"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">City</label>
							<input type="text" id="shipCity" placeholder="Los Angeles"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">State</label>
							<input type="text" id="shipState" placeholder="CA"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">ZIP Code</label>
							<input type="text" id="shipZip" placeholder="90001"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">Country</label>
							<input type="text" id="shipCountry" placeholder="United States"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div>
							<label class="block font-medium mb-1 text-gray-700">Phone Number</label>
							<input type="text" id="shipPhone" placeholder="+91 98765 43210"
								class="w-full border rounded p-2 focus:border-[#02B290] focus:outline-none">
						</div>
						<div class="md:col-span-2 flex justify-end gap-3 mt-4">
							<button type="button" id="cancelAddressBtn"
								class="bg-gray-300 text-gray-700 px-5 py-2 rounded-lg hover:bg-gray-400 transition">Cancel</button>
							<button type="button" id="saveAddressBtn"
								class="bg-[#02B290] text-white px-5 py-2 rounded-lg hover:bg-[#4dc9b1] transition">Save
								Address</button>
						</div>
					</form>
				</div>

				<div id="logoutSkeleton" class="hidden w-full bg-white shadow rounded-lg p-6 animate-pulse text-center">
					<div class="h-6 w-40 bg-gray-300 rounded mx-auto mb-4"></div>
					<div class="h-4 w-64 bg-gray-300 rounded mx-auto mb-6"></div>
					<div class="h-10 w-32 bg-gray-300 rounded mx-auto"></div>
				</div>

				<!-- Logout -->
				<div id="logout" class="tab-content hidden text-center py-10">
					<h2 class="text-2xl font-semibold text-[#02B290] mb-4">Ready to Leave?</h2>
					<p class="mb-6">Click below to securely log out from your account.</p>
					<a href="./login.html">
						<button class="bg-red-500 text-white px-6 py-2 rounded hover:bg-red-600">Logout</button>
					</a>
				</div>
			</section>
		</main>
	</div>

	<div id="footer_add" class="mt-12"></div>

	<script src="./js/rushita.js"></script>
	<script src="./js/Search.js"></script>
	<script src="./js/wishlist.js"></script>
	<script src="./js/addtocart.js"></script>
	<script src="./js/checkout.js"></script>

	<!-- CONSOLIDATED SCRIPTS -->
	<script>
		document.addEventListener("DOMContentLoaded", () => {

			const params = new URLSearchParams(window.location.search);
			const tabParam = params.get("tab") || "details";

			const skeletonMap = {
				details: document.getElementById("accountSkeleton"),
				orders: document.getElementById("ordersSkeleton"),
				shipping: document.getElementById("shippingSkeleton"),
				logout: document.getElementById("logoutSkeleton")
			};

			const tabButtons = document.querySelectorAll(".tab-btn");
			const tabContents = document.querySelectorAll(".tab-content");
			const mainContent = document.getElementById("accountMain");
			const accountForm = document.getElementById("accountForm");

			// hide all
			tabContents.forEach(c => c.classList.add("hidden"));
			Object.values(skeletonMap).forEach(s => s.classList.add("hidden"));
			tabButtons.forEach(b => b.classList.remove("active-tab"));
			mainContent.style.display = "none";

			// activate correct tab
			const activeBtn = document.querySelector(`.tab-btn[data-tab="${tabParam}"]`);
			if (activeBtn) activeBtn.classList.add("active-tab");

			// show correct skeleton
			skeletonMap[tabParam].classList.remove("hidden");

			// simulate loading
			setTimeout(() => {
				skeletonMap[tabParam].classList.add("hidden");
				mainContent.style.display = "block";
				document.getElementById(tabParam).classList.remove("hidden");
			}, 500);

			// ========== TAB SWITCHING ==========

			function hideAllSkeletons() {
				Object.values(skeletonMap).forEach(s => s.classList.add("hidden"));
			}

			tabButtons.forEach(btn => {
				btn.addEventListener("click", () => {
					const tab = btn.dataset.tab;

					// Active state
					tabButtons.forEach(b => b.classList.remove("active-tab"));
					btn.classList.add("active-tab");

					// Hide everything
					tabContents.forEach(c => c.classList.add("hidden"));
					hideAllSkeletons();
					mainContent.style.display = "none";

					// Show skeleton
					skeletonMap[tab].classList.remove("hidden");

					// Simulate loading
					setTimeout(() => {
						skeletonMap[tab].classList.add("hidden");
						mainContent.style.display = "block";
						document.getElementById(tab).classList.remove("hidden");
					}, 50);
				});
			});
			
			// Back to Profile (Account Details) from Orders
			const ordersBackBtn = document.getElementById("ordersBackBtn");
			if (ordersBackBtn) {
				ordersBackBtn.addEventListener("click", () => {
					const detailsBtn = document.querySelector('.tab-btn[data-tab="details"]');
					if (detailsBtn) detailsBtn.click();
				});
			}

			// ========== ACCOUNT DETAILS ==========
			const profileImage = document.getElementById("profileImage");
			const uploadImage = document.getElementById("uploadImage");
			const formFields = ["fullName", "email", "phone"];
			const editBtn = document.getElementById("editBtn");
			const saveBtn = document.getElementById("saveBtn");

			function randomName() {
				const names = ["Kiyan", "Rohan", "Neha", "Dhruv", "Aarav", "Kavya", "Dhara", "Mihir"];
				const surnames = ["Patel", "Shah", "Trivedi", "Mehta", "Joshi", "Desai", "Kapadia"];
				return names[Math.floor(Math.random() * names.length)] + " " + surnames[Math.floor(Math.random() * surnames.length)];
			}

			function randomEmail() {
				const prefix = "user" + Math.floor(Math.random() * 9000 + 1000);
				const domains = ["gmail.com", "yahoo.com", "outlook.com"];
				return prefix + "@" + domains[Math.floor(Math.random() * domains.length)];
			}

			function randomPhone() {
				let num = "+91 00000 00000";
				return num.replace(/0/g, () => Math.floor(Math.random() * 10));
			}

			// Load saved account data
			const savedData = JSON.parse(localStorage.getItem("accountDetails")) || {};
			if (savedData.image) profileImage.src = savedData.image;
			document.getElementById("fullName").value = savedData.fullName || randomName();
			document.getElementById("email").value = savedData.email || randomEmail();
			document.getElementById("phone").value = savedData.phone || randomPhone();

			// Upload image
			uploadImage.addEventListener("change", (e) => {
				const file = e.target.files[0];
				if (file) {
					const reader = new FileReader();
					reader.onload = (event) => {
						profileImage.src = event.target.result;
					};
					reader.readAsDataURL(file);
				}
			});

			// Edit button
			editBtn.addEventListener("click", () => {
				formFields.forEach(id => document.getElementById(id).disabled = false);
				if (accountForm) accountForm.classList.add("editing");
				editBtn.classList.add("hidden");
				saveBtn.classList.remove("hidden");
				document.querySelector('label[for="uploadImage"]').classList.remove("hidden");
			});

			// Save button
			saveBtn.addEventListener("click", () => {
				const data = {};
				formFields.forEach(id => {
					data[id] = document.getElementById(id).value.trim();
				});
				data.image = profileImage.src;
				localStorage.setItem("accountDetails", JSON.stringify(data));

				formFields.forEach(id => document.getElementById(id).disabled = true);
				if (accountForm) accountForm.classList.remove("editing");
				saveBtn.classList.add("hidden");
				editBtn.classList.remove("hidden");
				document.querySelector('label[for="uploadImage"]').classList.add("hidden");
				alert("Account details saved successfully!");
			});

			// ========== ORDERS ==========
			const ordersTableBody = document.getElementById('ordersTableBody');
			const ordersEmptyState = document.getElementById('ordersEmptyState');

			function getStatusClass(status = '') {
				const normalized = status.toLowerCase();
				if (normalized.includes('replaced')) return 'text-orange-600';
				if (normalized.includes('deliver')) return 'text-[#02B290]';
				if (normalized.includes('cancel')) return 'text-red-500';
				if (normalized.includes('pending')) return 'text-yellow-600';
				return 'text-blue-500';
			}

			function formatCurrency(amount) {
				const numeric = Number(amount);
				return Number.isNaN(numeric) ? '$0.00' : `$${numeric.toFixed(2)}`;
			}

			function renderOrders() {
				let orders = [];
				try {
					orders = JSON.parse(localStorage.getItem('orders')) || [];
				} catch (error) {
					console.error('Unable to read orders', error);
				}

				ordersTableBody.innerHTML = '';

				if (!orders.length) {
					ordersEmptyState.classList.remove('hidden');
					return;
				}

				ordersEmptyState.classList.add('hidden');

				orders.forEach((order) => {
					const row = document.createElement('tr');
					row.className = 'border-b';
					row.innerHTML = `
						<td class="py-2 px-3">#${order.orderId}</td>
						<td class="py-2 px-3">${order.orderDate}</td>
						<td class="py-2 px-3">${formatCurrency(order.total)}</td>
						<td class="py-2 px-3 font-medium ${getStatusClass(order.status)}">${order.status?.includes('Replaced') ? 'Replaced' : (order.status || 'Processing')}</td>
						<td class="py-2 px-3 flex gap-2">
							<button class="view-btn bg-[#02B290] text-white px-3 py-1 rounded hover:bg-[#4dc9b1]" data-order-id="${order.orderId}">View</button>
							<button class="cancel-btn bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" data-order-id="${order.orderId}">Cancel</button>
						</td>
					`;

					row.querySelector('.view-btn').addEventListener('click', () => {
						localStorage.setItem('selectedOrderId', order.orderId);
						window.location.href = './ordertarcking.html';
					});

					row.querySelector('.cancel-btn').addEventListener('click', () => {
						if (
							order.status &&
							order.status.toLowerCase().includes('cancel') &&
							!order.status.toLowerCase().includes('replace')
						) {
							alert('This order is already canceled.');
							return;
						}
						if (!confirm('Are you sure you want to cancel this order?')) return;

						order.status = 'Canceled';
						order.timeline = [
							{ label: 'Order Placed', state: 'completed', timestamp: new Date().toISOString() },
							{ label: 'Canceled', state: 'current', timestamp: new Date().toISOString() }
						];

						const updatedOrders = JSON.parse(localStorage.getItem('orders')) || [];
						const index = updatedOrders.findIndex(o => o.orderId === order.orderId);
						if (index !== -1) updatedOrders[index] = order;
						localStorage.setItem('orders', JSON.stringify(updatedOrders));
						alert(`Order #${order.orderId} has been canceled.`);
						renderOrders();
					});

					ordersTableBody.appendChild(row);
				});
			}

			renderOrders();

			// ========== SHIPPING ADDRESS ==========
		// ========== SHIPPING ADDRESS ==========
const addressList = document.getElementById("addressList");
const shippingForm = document.getElementById("shippingForm");
const toggleEditBtn = document.getElementById("toggleEdit");
const cancelAddressBtn = document.getElementById("cancelAddressBtn");
const saveAddressBtn = document.getElementById("saveAddressBtn");

let savedAddresses = JSON.parse(localStorage.getItem("userAddresses")) || [];

function renderAddresses() {
    addressList.innerHTML = "";

    if (savedAddresses.length === 0) {
        addressList.innerHTML = `<p class="text-gray-600 italic">No saved addresses yet.</p>`;
        return;
    }

    savedAddresses.forEach((addr, index) => {
        const card = document.createElement("div");
        card.className = "relative bg-black/5 border border-[#02B290]/20 rounded-2xl p-4 sm:p-6 shadow-sm mb-4";
        card.innerHTML = `
            <div class="absolute top-3 right-3 bg-[#02B290]/10 px-3 py-1 rounded-full text-sm text-[#02B290] font-medium">
                Address ${index + 1}
            </div>
            <p class="text-gray-800 font-semibold mb-1 max-w-[58%]">${addr.firstName || ""} ${addr.lastName || ""}</p>
            <p class="text-gray-600">${addr.address1 || ""}</p>
            <p class="text-gray-600">${addr.city || ""}, ${addr.state || ""} ${addr.zipcode || ""}</p>
            <p class="text-gray-600 mb-2">${addr.country || ""}</p>
            <p class="text-gray-700 font-medium"><i class="fa-solid fa-phone"></i> ${addr.phone || ""}</p>
            <div class="mt-3 flex gap-2">
                <button class="edit-btn bg-[#02B290] text-white text-sm px-3 py-1 rounded hover:bg-[#4dc9b1]" data-index="${index}">Edit</button>
                <button class="delete-btn bg-red-500 text-white text-sm px-3 py-1 rounded hover:bg-red-600" data-index="${index}">Delete</button>
            </div>
        `;
        addressList.appendChild(card);
    });

    document.querySelectorAll(".edit-btn").forEach(btn =>
        btn.addEventListener("click", e => editAddress(e.target.dataset.index))
    );
    document.querySelectorAll(".delete-btn").forEach(btn =>
        btn.addEventListener("click", e => deleteAddress(e.target.dataset.index))
    );
}

// Function to update the "Add New Address" button visibility
function updateAddButtonVisibility() {
    if (savedAddresses.length >= 4) {
        toggleEditBtn.disabled = true;
        toggleEditBtn.classList.add("opacity-50", "cursor-not-allowed");
        toggleEditBtn.title = "Maximum 4 addresses allowed";
    } else {
        toggleEditBtn.disabled = false;
        toggleEditBtn.classList.remove("opacity-50", "cursor-not-allowed");
        toggleEditBtn.title = "";
    }
}

renderAddresses();
updateAddButtonVisibility();

toggleEditBtn.addEventListener("click", () => {
    // Check if maximum addresses reached when adding new
    if (savedAddresses.length >= 4 && shippingForm.dataset.editIndex === "") {
        alert("Maximum 4 addresses allowed. Please delete an existing address to add a new one.");
        return;
    }
    
    shippingForm.reset();
    shippingForm.dataset.editIndex = "";
    shippingForm.classList.remove("hidden");
    addressList.classList.add("hidden");
    toggleEditBtn.classList.add("hidden");
});

cancelAddressBtn.addEventListener("click", () => {
    shippingForm.classList.add("hidden");
    addressList.classList.remove("hidden");
    toggleEditBtn.classList.remove("hidden");
});

function validateFields() {
    const fields = {
        firstName: document.getElementById("shipfname"),
        lastName: document.getElementById("shiplname"),
        address1: document.getElementById("shipStreet"),
        city: document.getElementById("shipCity"),
        state: document.getElementById("shipState"),
        zipcode: document.getElementById("shipZip"),
        country: document.getElementById("shipCountry"),
        phone: document.getElementById("shipPhone")
    };

    const alphaRegex = /^[A-Za-z\s]+$/;
    const numericRegex = /^[0-9]+$/;
    const phoneRegex = /^[\+0-9\s\-\(\)]+$/; // Allow +, spaces, dashes, parentheses
    let isValid = true;

    Object.values(fields).forEach(input => input.classList.remove("border-red-500"));

    Object.values(fields).forEach(input => {
        if (input.value.trim() === "") {
            input.classList.add("border-red-500");
            isValid = false;
        }
    });

    ["firstName", "lastName", "city", "state"].forEach(key => {
        if (fields[key].value.trim() !== "" && !alphaRegex.test(fields[key].value.trim())) {
            fields[key].classList.add("border-red-500");
            isValid = false;
        }
    });

    if (fields.zipcode.value.trim() !== "" && !numericRegex.test(fields.zipcode.value.trim())) {
        fields.zipcode.classList.add("border-red-500");
        isValid = false;
    }

    // Check phone: must have at least 7 digits (excluding formatting characters)
    const phoneDigits = fields.phone.value.replace(/[^\d]/g, '');
    if (fields.phone.value.trim() !== "" && (phoneDigits.length < 7 || !phoneRegex.test(fields.phone.value.trim()))) {
        fields.phone.classList.add("border-red-500");
        isValid = false;
    }

    return { isValid, fields };
}

saveAddressBtn.addEventListener("click", () => {
    const { isValid, fields } = validateFields();
    if (!isValid) {
        alert("Please correct highlighted fields.");
        return;
    }

    const editIndex = shippingForm.dataset.editIndex;
    
    // Check if trying to add new address when already at maximum
    if (editIndex === "" && savedAddresses.length >= 4) {
        alert("Maximum 4 addresses allowed. Please delete an existing address to add a new one.");
        return;
    }

    const newAddress = {
        firstName: fields.firstName.value.trim(),
        lastName: fields.lastName.value.trim(),
        address1: fields.address1.value.trim(),
        city: fields.city.value.trim(),
        state: fields.state.value.trim(),
        zipcode: fields.zipcode.value.trim(),
        country: fields.country.value.trim(),
        phone: fields.phone.value.trim()
    };

    if (editIndex !== "") {
        savedAddresses[editIndex] = newAddress;
    } else {
        savedAddresses.push(newAddress);
    }

    localStorage.setItem("userAddresses", JSON.stringify(savedAddresses));
    alert("Address saved successfully!");

    shippingForm.classList.add("hidden");
    addressList.classList.remove("hidden");
    toggleEditBtn.classList.remove("hidden");
    renderAddresses();
    updateAddButtonVisibility();
});

function editAddress(index) {
    const a = savedAddresses[index];
    document.getElementById("shipfname").value = a.firstName;
    document.getElementById("shiplname").value = a.lastName;
    document.getElementById("shipStreet").value = a.address1;
    document.getElementById("shipCity").value = a.city;
    document.getElementById("shipState").value = a.state;
    document.getElementById("shipZip").value = a.zipcode;
    document.getElementById("shipCountry").value = a.country;
    document.getElementById("shipPhone").value = a.phone;

    shippingForm.dataset.editIndex = index;
    shippingForm.classList.remove("hidden");
    addressList.classList.add("hidden");
    toggleEditBtn.classList.add("hidden");
}

function deleteAddress(index) {
    if (confirm("Are you sure you want to delete this address?")) {
        savedAddresses.splice(index, 1);
        localStorage.setItem("userAddresses", JSON.stringify(savedAddresses));
        renderAddresses();
        updateAddButtonVisibility();
    }
}
